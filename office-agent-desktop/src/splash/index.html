<!doctype html>
<!--
  coscribe desktop's startup splash -- ported from office-agent-desktop's
  (Tauri) dist/index.html. There the page itself polled the sidecar via
  fetch() and redirected once it responded, because Rust had no cheap way
  to push "ready" into the page except a Tauri event. Here the main
  process (mainWindow.ts) already owns the readiness poll and navigates
  the window directly via loadURL() once the sidecar answers -- this page
  no longer polls anything, it only ever needs to *display* a failure,
  pushed via the preload bridge's onSidecarStatus() (mirrors the Tauri
  version's "sidecar-status" event listener).

  Colors match office-agent/frontend/src/index.css's tokens, and the web
  app shows an identical splash (StartupSplash.tsx) until its own data
  has loaded, so the handoff between the two is seamless.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>coscribe</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fcfcfb;
        --fg: #201e1d;
        --muted: #7d7979;
        --accent: #de6f90;
        --danger: #dd2b0f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #232120;
          --fg: #f7f5f3;
          --muted: #a19d9b;
          --accent: #ef92ab;
          --danger: #ff6b52;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        /* The window has no OS title bar; the whole splash moves it. */
        app-region: drag;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 3px solid color-mix(in srgb, var(--fg) 15%, transparent);
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .status {
        font-size: 13px;
        color: var(--muted);
        min-height: 1.2em;
        text-align: center;
        max-width: 320px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner" id="spinner"></div>
      <div class="title" id="title">Starting coscribe&hellip;</div>
      <div class="status" id="status">Still starting up&hellip;</div>
    </div>
    <script>
      const spinnerEl = document.getElementById("spinner");
      const titleEl = document.getElementById("title");
      const statusEl = document.getElementById("status");
      const LOG_HINT = "%APPDATA%\\coscribe\\logs\\coscribe-server.log";

      window.coscribeDesktop.onSidecarStatus((reason) => {
        spinnerEl.style.display = "none";
        titleEl.textContent = "coscribe couldn't start";
        titleEl.style.color = "var(--danger)";
        statusEl.textContent =
          (reason === "timeout"
            ? "The server is taking far longer than expected."
            : "The server process exited unexpectedly.") + ` Check the log for details: ${LOG_HINT}`;
      });
    </script>
  </body>
</html>
