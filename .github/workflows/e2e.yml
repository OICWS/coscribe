name: E2E

# The Playwright specs in office-agent/frontend/tests/e2e/ run against the real server and a
# stub model (scripts/stub_llm.py, which answers "OK" to everything), so a UI regression
# shows up the next morning instead of when someone happens to use that screen. It runs
# nightly and by hand (and on a pull request that changes this file, so the workflow proves itself), and it is not a required check: a red run
# is read in the morning. No model key is used.
"on":
  schedule:
    - cron: "31 21 * * *"
  workflow_dispatch:
  # A change to this file or to a spec, so neither first runs at night: a red night costs a day.
  pull_request:
    paths:
      - ".github/workflows/e2e.yml"
      - "office-agent/frontend/tests/e2e/**"
      - "office-agent/scripts/stub_llm.py"

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: office-agent

env:
  # The specs that pass against the stub model. This is the one list; a spec that is not
  # here is left out for the reason given:
  #   approval.spec.ts  needs a model that decides on its own to call a tool that asks first
  #                     (the stub only calls the tool a message names, see slides.spec.ts)
  #   chat.spec.ts      checks the model's answer ("4"); the stub only says "OK"
  # A spec file in neither list fails the run, so a new spec is never skipped unnoticed.
  EXCLUDED: approval chat
  SPECS: >-
    artifacts attachment chat-files code composer-drop-paste connector-setup connectors find labels navigation
    panel-windows panels permissions workflow-agent workflow-canvas workflow-run-canvas rail-dialog secrets settings sidebar skill-plugins slides slides-panels slides-stage slides-drafts slides-foreign titlebar tool-rows plan-panel plan-proposal plan-comments image-annotation prompt-suggestion run-in-background design-systems doc-editor dashboard design-canvas toolbar python-interpreter capabilities

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: office-agent/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: office-agent/frontend/package-lock.json

      # keyrings.alt gives secrets.spec.ts a keychain; a Linux runner has none. pytest is imported
      # by tests/test_deck_engine.py, whose pages slides.spec.ts builds its deck from.
      - name: Install coscribe
        run: pip install -e ".[web]" keyrings.alt pytest

      # The server serves web/static/, a build output.
      - name: Build the frontend and install Chromium
        working-directory: office-agent/frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Start the stub model, the server and the dev server
        run: |
          scratch="$RUNNER_TEMP/e2e"
          mkdir -p "$scratch/workspace"
          cat > "$scratch/providers.json" <<JSON
          {"providers": {"stub": {"base_url": "http://127.0.0.1:9999/v1", "api_key": "x"}}}
          JSON
          cat > "$scratch/.env" <<ENV
          COSCRIBE_PROVIDERS_CONFIG_PATH=$scratch/providers.json
          COSCRIBE_DEFAULT_MODEL=stub:fake
          COSCRIBE_WORKSPACE_ROOT=$scratch/workspace
          COSCRIBE_STATE_DIR=$scratch/state
          ENV
          nohup python scripts/stub_llm.py > "$scratch/stub.log" 2>&1 &
          (cd "$scratch" && COSCRIBE_LAUNCH_TOKEN=e2e-launch-token PYTHON_KEYRING_BACKEND=keyrings.alt.file.PlaintextKeyring \
            XDG_DATA_HOME="$scratch/xdg" nohup coscribe-web > "$scratch/web.log" 2>&1 &)
          (cd frontend && COSCRIBE_LAUNCH_TOKEN=e2e-launch-token nohup npx vite --host 127.0.0.1 > "$scratch/vite.log" 2>&1 &)
          for url in http://127.0.0.1:9999/v1/models http://127.0.0.1:8000/ http://127.0.0.1:5173/static/; do
            for _ in $(seq 60); do curl -sf "$url" > /dev/null && continue 2; sleep 1; done
            echo "$url did not come up"; tail -n 30 "$scratch"/*.log; exit 1
          done

      - name: Specs
        working-directory: office-agent/frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          COSCRIBE_BACKEND: http://127.0.0.1:8000
          COSCRIBE_E2E_WORKSPACE: ${{ runner.temp }}/e2e/workspace
        run: |
          export PLAYWRIGHT_CHROMIUM_PATH="$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')"
          for f in tests/e2e/*.spec.ts; do
            name="$(basename "$f" .spec.ts)"
            case " $SPECS $EXCLUDED " in *" $name "*) ;; *) echo "$name.spec.ts is in neither SPECS nor EXCLUDED"; exit 1;; esac
          done
          files=()
          for name in $SPECS; do files+=("tests/e2e/$name.spec.ts"); done
          npx playwright test "${files[@]}" --reporter=list,json,html --trace=retain-on-failure

      - name: Summary
        if: always()
        working-directory: office-agent/frontend
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              report = json.load(open("playwright-report.json"))
          except OSError:
              print("No report was written.")
              raise SystemExit
          failed = []
          def walk(suite):
              for spec in suite.get("specs", []):
                  if not spec["ok"]:
                      failed.append((spec["file"], spec["title"]))
              for child in suite.get("suites", []):
                  walk(child)
          for top in report["suites"]:
              walk(top)
          stats = report["stats"]
          total = stats["expected"] + stats["unexpected"] + stats["flaky"] + stats["skipped"]
          print(f"## E2E against the stub model: {total} tests, {stats['unexpected']} failed, "
                f"{stats['flaky']} flaky, {stats['skipped']} skipped\n")
          for error in report.get("errors", []):
              print(f"- load error: {error.get('message', '')[:200]}")
          for file, title in failed:
              print(f"- `{file}`: {title}")
          PY

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            office-agent/frontend/playwright-report/
            office-agent/frontend/test-results/
            office-agent/frontend/playwright-report.json
            ${{ runner.temp }}/e2e/*.log
