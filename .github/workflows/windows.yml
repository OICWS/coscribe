name: Windows

# What a Windows machine would catch that the Linux job cannot: paths, the code page,
# PowerShell and cmd, the keychain. It is not a required check yet, so a red run does not
# block a pull request, but the run is red when a test fails: the run page and the
# nightly history show it. It runs nightly, by hand, and on a pull request that changes
# this file (a pull request that fixes a test only Windows fails touches a comment here to get its
# Windows run). When it has been green for two weeks it becomes a required check (decision 0009).
"on":
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      # The AppContainer is only real on Windows: its tests skip everywhere else.
      - "office-agent/src/coscribe/tools/exec/_appcontainer.py"
      - "office-agent/src/coscribe/tools/exec/isolation.py"
      - "office-agent/src/coscribe/tools/exec/running.py"
      - "office-agent/src/coscribe/tools/exec/own_python.py"
      - "office-agent/src/coscribe/tools/exec/script_env.py"
      - "office-agent/tests/test_isolation.py"

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: office-agent

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: office-agent/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: office-agent/frontend/package-lock.json

      # web/static/ is a build output that tests constructing the app need.
      - name: Build the frontend
        working-directory: office-agent/frontend
        run: |
          npm ci
          npm run build

      - name: Install coscribe
        run: |
          pip install -e ".[dev,web]"

      # The text widths the deck engine sizes boxes with, measured on this machine's fonts.
      # The table is committed; the test below keeps it equal to the fonts.
      - name: Measure font advances
        run: python scripts/measure_font_advances.py "C:/Windows/Fonts" --out windows-font-advances.json

      - name: Tests
        run: python -m pytest -q -p no:cacheprovider -s -x tests/test_scripts_tool.py tests/test_node_scripts_tool.py

      - name: Summary of the failures
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("windows-junit.xml").getroot()
          except OSError:
              print("No test report was written.")
              raise SystemExit
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          failed = [
              f"{case.get('classname')}::{case.get('name')}"
              for case in root.iter("testcase")
              if case.find("failure") is not None or case.find("error") is not None
          ]
          print(f"## Windows: {suite.get('tests')} tests, {len(failed)} failed or errored\n")
          for name in failed:
              print(f"- `{name}`")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-junit
          path: |
            office-agent/windows-junit.xml
            office-agent/windows-font-advances.json
