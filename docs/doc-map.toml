# Each living document, and the paths whose change can make it untrue. A pull request that changes
# one of these paths either changes the document too or says in its description that the document
# still holds: `Docs checked: SECURITY.md (still true)`. office-agent/scripts/doc_impact.py checks
# it, in the PR text workflow. A path is a prefix: a folder covers everything under it.
#
# `added_or_removed` paths count only when a file under them is added, removed or renamed.
# A Python module's card (AGENTS.md beside its __init__.py) is found by the script: a module that
# gains, loses or renames a file, or changes __init__.py, asks for it. A tool's parameters live in
# its docstring, kept by tests/tool_schemas.txt.

[[doc]]
path = "SECURITY.md"
covers = [
  "office-agent/src/coscribe/tools/exec/",
  "office-agent/src/coscribe/runtime/secret",
  "office-agent/src/coscribe/code_runtime/permissions.py",
  "office-agent/src/coscribe/web/local_guard.py",
  "office-agent/src/coscribe/runtime_lg/mcp_oauth.py",
  "office-agent/src/coscribe/conversation/approvals.py",
  "docs/decisions/",
]

[[doc]]
path = "docs/security/review-pack.md"
